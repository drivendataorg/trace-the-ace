# CPU-only checks: no secrets, no weights, no competition data.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.3.3 scipy==1.16.3 scikit-learn==1.7.2 lightgbm==4.6.0 pytest
      - name: Compile
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pyc
        run: python -m compileall -q src scripts inference
      - name: Shell syntax
        run: for f in scripts/*.sh envs/*.sh; do bash -n "$f"; done
      - name: Tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest -q
